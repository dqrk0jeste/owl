# '#' makes a comment. you can only comment whole lines.
#
# all config values consis of a keyword followed by the list of args, all space separated;
# usage of multiple spaces or tabs is fine. if you need spaces in an argument use double
# quotes as in "argument with spaces"
#
# note: if you need to use double quotes inside then escape them by using \". if you need
# to use \ escape it by using \\ e.g. if you need to interpolate strings in bash commands
#   keybind super h "echo \"my home is \\$HOME\\\""
# it will be parsed as
#   echo "my home is \$HOME\"
# you are highly advised to use scripts for more complicated actions

# .-------------.
# | ENVIRONMENT |
# '-------------'
# you can add env variables with env <name> <value>
env EDITOR nvim
env BROWSER firefox

# recommended to have set
env XDG_CURRENT_DESKTOP mwc
env XDG_SESSION_DESKTOP mwc
env XDG_SESSION_TYPE wayland

# qt stuff
env QT_QPA_PLATFORM wayland
env QT_WAYLAND_DISABLE_WINDOWDECORATION 1
env QT_STYLE_OVERRIDE kvantum
env QT_AUTO_SCREEN_SCALE_FACTOR 1

# .--------------.
# | RUN ON START |
# '--------------'
# run runs its argument on startup; see the usage of double quotes
run "gsettings set org.gnome.desktop.interface cursor-theme Bibata-Modern-Ice"
run "gsettings set org.gnome.desktop.interface cursor-size 24"

# this starts xdg-desktop-portals in the right order so things like screensharing work
run "$HOME/scripts/fix-portals.sh"

# other apps you want on startup
run waybar
run swww-daemon
run dunst
run $HOME/scripts/check_battery.sh

#### CONTINUE

# .---------.
# | OUTPUTS |
# '---------'
# you should specify the output modes and position of your outputs
#   output_mode <name> <width> <height> <refresh_rate> <scale>
#   output_mode <name> <width> <height> <refresh_rate> <scale>
# note: scale it optional and defaults to 1 if skipped
output_mode HDMI-A-1 1920 1080 60
output_mode eDP-1 1920 1080 60

output_position HDMI-A-1 0 0
output_position eDP-1 1920 0

# .-----------.
# | KEYBOARDS |
# '-----------'
# specify the keymaps you want to use and what variation of it you want to use.
# you need to use empty quotes for default options.
keymap us ""
keymap rs ""
keymap rs latinunicodeyz
# keymap_options should be comma separated list of xkb options
keymap_options "grp:alt_space_toggle,compose:menu"

keyboard_rate 30
keyboard_delay 200

# .----------.
# | POINTERS |
# '----------'
# you need to explicitly enable things you want. keep in mind that any of these
# options might fail if your pointer device does not support it.

# how sensitive you pointer (mouse, trackpad) should be. in range [-1.0, 1.0]:
# 0 is the default, -1.0 slowest, 1.0 fastest
pointer_sensitivity 0
# wheather or not to apply pointer acceleration
pointer_acceleration 0
# you can override these values per device if needed with
# pointer <name> <acceleration> <sensitivity>
# to find the name of the specific device run
# sudo libinput list-devices | grep -i "device"
pointer "ELAN0771:00 04F3:3245 Touchpad" 1 0.3
# set to 1 if you want to invert clicks. note that this option is device specific
pointer_left_handed 0

# .-----------.
# | TRACKPADS |
# '-----------'
# wheater or not to disable a trackpad while typing
trackpad_disable_while_typing 0
# enable natural scroll for trackpads; also available as `natural_scroll` for backwards compatibility
trackpad_natural_scroll 1
# enable tap to click for trackpads; also available as `tap_to_click` for backwards compatibility
trackpad_tap_to_click 1
# one of 'no_scroll', 'two_fingers', 'edge' or 'on_button_down'
trackpad_scroll_method two_fingers

# .--------.
# | CURSOR |
# '--------'
cursor_theme Bibata-Modern-Ice
cursor_size 24

# .------------.
# | WORKSPACES |
# '------------'
# you should specify your workspaces with
#   workspace <index> <output_name>
# not doing so will give you just one workspace per monitor. index is not that important,
# you dont have to write them seqentially, but be sure to use the same ones for keybinds,
# see under
workspace 1 HDMI-A-1
workspace 2 HDMI-A-1
workspace 3 HDMI-A-1
workspace 4 HDMI-A-1
workspace 5 HDMI-A-1

workspace 6 eDP-1
workspace 7 eDP-1
workspace 8 eDP-1
workspace 9 eDP-1
workspace 10 eDP-1

# .--------.
# | LAYOUT |
# '--------'
outer_gaps 12
inner_gaps 6
# you can specify how many master toplevels you want, especially useful for wide monitors
master_count 1
# you can specify how much width will masters take. setting it to 0 or skipping it will
# space the width evenly between masters and the slave stack
master_ratio 0.6


# .-----------.
# | TITLEBARS |
# '-----------'
# draw titlebars; can be overriden using toplevel rules, see bellow
titlebars 1
# configure server side titlebars
titlebar_height 36
# one or two colors in hex rgb or rgba format, used for active and inactive state
titlebar_color 11111be6 1e1e2ecc
# wheater or not to draw the close button
titlebar_include_close_button 1
# where to draw the close button; one of `left` or `right`
titlebar_close_button_position right
titlebar_close_button_size 16
# padding around the close button, one value means the same for left and right, two
# values are left and right seperately
titlebar_close_button_padding 16 0
# same as for the `titlebar_color`
titlebar_close_button_color f38ba8 585b70
# one of `circle` or `square`
titlebar_close_button_shape circle
# wheater or not to draw a title
titlebar_include_title 1
# wheater or not to center a title
titlebar_center_title 0
# font that should be loaded in the freefont format
titlebar_title_font "Lexend:size=18"
# color of the title letters
titlebar_title_color cdd6f4
# same as for the `titlebar_close_button_padding` but for title
titlebar_title_padding 0 16

# .---------.
# | BORDERS |
# '---------'
# draw borders; can be overriden using toplevel rules, see bellow
borders 1
border_width 1
border_color c0a36e 1f1f28
# border radius to be applied; this option is applied wheater or not there is a border or not
border_radius 12
# set where to draw the rounded corners, multiple options allowed. default it all
#   - all
#   - top
#   - bottom
#   - right
#   - left
#   - top_right
#   - top_left
#   - bottom_right
#   - bottom_left
border_radius_location all
# example
# border_radius_location top_left bottom_right

# .---------.
# | SHADOWS |
# '---------'
shadows 1
shadow_blur 15
shadow_size 24
# example 1: at the origin, this makes the shadow appear only on the right and bottom
shadow_position 0 0
# example 2: translated 12 pixels to the left and 12 pixels up; this makes it appear simmetrically under the toplevel
# shadows_position -12 -12
shadow_color 000000ff

# .---------.
# | OPACITY |
# '---------'
# toplevel opacity for focused/unfocused toplevel state. you can use just a single value
# for both. you can override these per toplevel using toplevel rules, see below
opacity 0.9 0.8
# opacity 0.9
apply_opacity_when_fullscreen 1

# .------.
# | BLUR |
# '------'
blur 1
# optimized blur blurs only the background (usually just an image) so it only updated the
# blur when the background changes, saving A LOT of power. options here are 'always',
# 'tiled_only' and 'never'. the default is 'always'. note: this does not affect layer
# blur, you should set those up per layer using layer rules, see bellow
blur_optimized always
blur_passes 3
blur_radius 5
# you should keep these values similar to the values bellow, as they are really sensitive
blur_noise 0.02
blur_brightness 0.9
blur_contrast 0.9
blur_saturation 1.2

# .------------.
# | ANIMATIONS |
# '------------'
# enable animations
animations 1
animation_duration 400
# cubic bezier curve to use for the animation; you should use sane values here
animation_curve 0.05 0.9 0.1 1.05

# .----------.
# | KEYBINDS |
# '----------'
# keybinds are done in this form
# keybind <modifiers> <key> <action> ...args
# actions are
#   exit - quits mwc
#   workspace <index> - go to workspace index
#   move_to_workspace <index> - move focused toplevel to workspace index
#   run <command> - run command
#   start_resize - start resizing the focused toplevel or layout master_ratio
#   start_move - start moving the focused toplevel
#   move_focus <direction> - move focus to another toplevel in direction
#   move <direction> - move toplevel in direction
#   close - close the focused toplevel
#   toggle_floating - switch the floating state of the focused toplevel
#   toggle_fullscreen - toggle the fullscreen state of the focused toplevel
# special key names you can use are
#   enter
#   backspace
#   delete
#   tab
#   up, down, left, right
#   pointer_left_click, pointer_right_click, pointer_middle_click
# other keys you are supposed to use with their xkb name

keybind super escape exit

# cycle workspaces
keybind super n next_workspace
keybind super p prev_workspace

keybind super 1 workspace 1
keybind super 2 workspace 2
keybind super 3 workspace 3
keybind super 4 workspace 4
keybind super 5 workspace 5
keybind super 6 workspace 6
keybind super 7 workspace 7
keybind super 8 workspace 8
keybind super 9 workspace 9
keybind super 0 workspace 10

# use + for multiple modifiers
keybind super+shift 1 move_to_workspace 1
keybind super+shift 2 move_to_workspace 2
keybind super+shift 3 move_to_workspace 3
keybind super+shift 4 move_to_workspace 4
keybind super+shift 5 move_to_workspace 5
keybind super+shift 6 move_to_workspace 6
keybind super+shift 7 move_to_workspace 7
keybind super+shift 8 move_to_workspace 8
keybind super+shift 9 move_to_workspace 9
keybind super+shift 0 move_to_workspace 10

keybind super t run foot
keybind super a run "killall rofi || rofi -show drun"
keybind super f run firefox
keybind super e run "foot yazi"

keybind super b run "$HOME/scripts/change_wallpaper.sh"
keybind super o run "$HOME/scripts/screenshot.sh"

keybind super x start_resize
keybind super z start_move

keybind super k move_focus up
keybind super j move_focus down
keybind super l move_focus right
keybind super h move_focus left

keybind super+shift k move up
keybind super+shift j move down
keybind super+shift l move right
keybind super+shift h move left

keybind super q close
keybind super w toggle_floating
keybind super u toggle_fullscreen

# use _ for no modifiers (you can actually put anything wrong there and it will work)
keybind _ XF86MonBrightnessUp run "light -A 5"
keybind _ XF86MonBrightnessDown run "light -U 5"

keybind _ XF86AudioRaiseVolume run "pactl set-sink-volume 0 +5%"
keybind _ XF86AudioLowerVolume run "pactl set-sink-volume 0 -5%"

keybind super equal run "pactl set-sink-volume 0 +5%"
keybind super minus run "pactl set-sink-volume 0 -5%"

keybind _ XF86AudioMute run "pactl set-sink-mute 0 toggle"
keybind _ XF86AudioMicMute run "pactl set-source-mute 0 toggle"

keybind super backspace run "killall rofi || $HOME/scripts/leave.sh"
keybind super period run "(pidof wlsunset && killall wlsunset) || wlsunset"

keybind super+shift backspace run hyprlock

# you can bind mouse buttons for shortcuts by prefixing them with pointer_ followed by
#   - left_click
#   - right_click
#   - middle_click
#   - or a number that represents that pointer button (you can get it by running `wev`)
# e.g. left click is usually 272 (that is what mwc assumes and replaces left_click with)
keybind super pointer_right_click start_resize
keybind super pointer_left_click start_move

# .----------------.
# | TOPLEVEL RULES |
# '----------------'
# toplevel rules are done with
# toplevel_rule <app_id regex> <title regex> <predicate> ...args
# predicate can be
#   - float - to float by default
#   - size <width> <height> - to be specific size (only if floating);
#                           sizes can either be absolute or relative
#   - opacity <active_value> <inactive_value> - opacity to use for this toplevel; if you wish to use the same value
#                                             for both active and inactive state you can put just one value here
#   - blur <value> - wheather or not to blur this toplevel
#   - titlebar <value> - wheather or not to draw the titlebar for this toplevel
#   - border <value> - wheather or not to draw the border for this toplevel
#   - shadow <value> - wheather or not to draw the shadow for this toplevel
# note: you can use _ to ignore class/title
# note2: to find app_ids/titles you can use the ipc, e.g.
#   mwc-ipc get toplevels
toplevel_rule imv _ float
toplevel_rule imv _ size 80% 80%

toplevel_rule nwg-look _ float
toplevel_rule nwg-look _ size 1024 576

toplevel_rule kvantummanager _ float
toplevel_rule kvantummanager _ size 1024 576

toplevel_rule org.pulseaudio.pavucontrol _ float
toplevel_rule org.pulseaudio.pavucontrol _ size 1024 576

toplevel_rule blueman-manager _ float
toplevel_rule blueman-manager _ size 1024 576

toplevel_rule nm-connection-editor _ float
toplevel_rule nm-connection-editor _ size 1024 576

toplevel_rule firefox Library float
toplevel_rule firefox Library size 1024 576

# set opacity rules; later matches override previous ones
# e.g. if you want firefox to be transperent, except when youtube is playing do
window_rule firefox .*YouTube.* opacity 1

# dont draw the titlear (border) on the discord startup popup
window_rule vesktop vesktop titlebar 0
# window_rule vesktop vesktop border 0

# .-------------.
# | LAYER RULES |
# '-------------'
# syntax is
#   layer_rule <namespace> <predicate> ...args
# where predicate is
#   - blur <optimized> <ignore transparent> - blur this layer surface. optional argument configure if the blur should be
#   optimized (xray) and if the transparent pixels should be ignored
layer_rule rofi blur 1 0
layer_rule waybar blur

